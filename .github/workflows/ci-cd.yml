name: Landing Page Paroquia São Gabriel Arcanjo

on: 
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout Code
              uses: actions/checkout@v3
            
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                node-version: 20
                cache: "npm"
                cache-dependency-path: .package-lock.json

            - name: Lint Project
              run: npm run lint
              working-directory: ./src

            - name: Build project
              run: npm run build
              working-directory: ./src

